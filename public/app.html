<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나만의 대시보드</title>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>대시보드</span>
        <div class="header-actions">
          <button class="icon-btn" id="hideSidebarBtn" title="메뉴 숨기기">◀</button>
          <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </div>
      </div>
      <div class="menu-list" id="menuList">
        <div class="menu-empty">불러오는 중...</div>
      </div>
    </aside>

    <div class="main">
      <button class="show-sidebar-btn" id="showSidebarBtn" title="메뉴 보이기">☰</button>
      <div class="content" id="content">
        <div class="content-placeholder">왼쪽 메뉴에서 페이지를 선택하세요</div>
      </div>
    </div>
  </div>

  <script src="/assets/js/app.js"></script>
</body>
</html>
