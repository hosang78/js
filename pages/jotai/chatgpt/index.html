<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jotai 종합 기능 실험실</title>
  <script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
  <style>
    :root{--bg:#f3f7f5;--panel:#fff;--ink:#16201c;--muted:#67736d;--line:#dce7e1;--green:#22a06b;--green2:#087a52;--soft:#e9f8f1;--amber:#f6a723;--red:#d84a4a;--shadow:0 12px 30px rgba(21,55,42,.09)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#eff8f3,#f7f9f8 45%,#eef5ff);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.app{max-width:1480px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#0f6d4d,#22a06b 58%,#55c696);color:#fff;border-radius:24px;padding:26px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-80px;top:-160px;background:rgba(255,255,255,.12)}
    .hero h1{font-size:clamp(28px,4vw,48px);margin:0 0 6px}.hero p{margin:0;opacity:.9}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:7px 10px;border-radius:999px;font-size:12px}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.toolbar button,.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--green);color:#fff;font-weight:700}.btn.alt{background:#eef4f1;color:#315044}.btn.warn{background:#fff4df;color:#975e00}.btn.danger{background:#ffeded;color:#a52a2a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 15px rgba(21,55,42,.04)}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 7px 20px rgba(21,55,42,.055);min-height:190px}.card.wide{grid-column:span 6}.card.full{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 4px}.card .desc{font-size:12px;color:var(--muted);margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:9px}.value{font-size:35px;font-weight:900;color:var(--green2)}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#10251d;color:#c7f5de;padding:9px 10px;border-radius:9px;font-size:11px;overflow:auto}.pill{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--green2);font-size:11px;font-weight:700}.input{width:100%;border:1px solid var(--line);padding:9px 10px;border-radius:9px}.meter{height:9px;background:#edf1ef;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#79d8aa)}
    .todo{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px}.todo.done span{text-decoration:line-through;color:#929c97}.todo span{flex:1}.log{max-height:170px;overflow:auto;background:#0e1713;color:#c9ded4;padding:10px;border-radius:10px;font-family:monospace;font-size:11px}.log div{padding:3px 0;border-bottom:1px solid #24352e}.error{background:#ffefef;color:#9c2626;padding:12px;border-radius:10px}.skeleton{height:60px;border-radius:10px;background:linear-gradient(90deg,#edf2ef,#f8faf9,#edf2ef);background-size:200% 100%;animation:pulse 1.2s infinite}@keyframes pulse{to{background-position:-200% 0}}
    .footer{color:var(--muted);font-size:12px;text-align:center;padding:22px}.hidden{display:none!important}
    @media(max-width:980px){.card,.card.wide{grid-column:span 6}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.app{padding:10px}.hero{padding:22px 18px;border-radius:18px}.card,.card.wide{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.toolbar{position:sticky;top:0;z-index:10;background:rgba(243,247,245,.94);padding:8px 0;backdrop-filter:blur(8px)}}
  </style>
</head>
<body><div id="root"><div style="padding:30px;font-family:sans-serif">Jotai 실험실을 불러오는 중…</div></div>
<script type="text/babel" data-type="module" data-presets="react">
import React, { Suspense, useEffect, useMemo, useState } from 'https://esm.sh/react@19.1.0';
import { createRoot } from 'https://esm.sh/react-dom@19.1.0/client?deps=react@19.1.0';
import { atom, Provider, useAtom, useAtomValue, useSetAtom, createStore } from 'https://esm.sh/jotai@2.20.1?deps=react@19.1.0';
import { atomWithStorage, atomWithReset, RESET, atomFamily, selectAtom, splitAtom, loadable, freezeAtom, atomWithReducer } from 'https://esm.sh/jotai@2.20.1/utils?deps=react@19.1.0';

const countAtom=atom(0); countAtom.debugLabel='countAtom';
const doubleAtom=atom(get=>get(countAtom)*2);
const tripleAtom=atom(get=>get(countAtom)*3);
const textAtom=atom('Jotai');
const upperAtom=atom(get=>get(textAtom).toUpperCase());
const incrementAtom=atom(null,(get,set,amount=1)=>set(countAtom,get(countAtom)+amount));
const guardedAtom=atom(10,(get,set,next)=>{ const v=typeof next==='function'?next(get(guardedAtom)):next; set(guardedAtom,Math.max(0,Math.min(100,v))); });
const themeAtom=atomWithStorage('jotai-lab-theme','light');
const resettableAtom=atomWithReset(50);
const reducerAtom=atomWithReducer({count:0,step:2},(state,action)=>action.type==='inc'?{...state,count:state.count+state.step}:action.type==='step'?{...state,step:action.value}:action.type==='reset'?{count:0,step:2}:state);
const userAtom=atom({name:'김해양',role:'관리자',department:'ICT전략실'});
const userNameAtom=selectAtom(userAtom,u=>u.name);
const frozenAtom=freezeAtom(atom({settings:{sound:true,compact:false}}));
const todosAtom=atom([{id:1,text:'기본 atom 확인',done:true},{id:2,text:'파생 atom 조작',done:false},{id:3,text:'splitAtom 항목 수정',done:false}]);
const todoAtomsAtom=splitAtom(todosAtom);
const family=atomFamily((id)=>atom({id,score:Math.floor(id*17%100)}));
const asyncBaseAtom=atom(async()=>{await new Promise(r=>setTimeout(r,900));return {time:new Date().toLocaleTimeString('ko-KR'),message:'비동기 atom 로딩 완료'};});
const loadableAsyncAtom=loadable(asyncBaseAtom);
const refreshAtom=atom(0);
const refreshableAsyncAtom=atom(async get=>{get(refreshAtom);await new Promise(r=>setTimeout(r,700));return Math.floor(Math.random()*1000);});
const store=createStore();

function Card({title,desc,wide=false,full=false,children,tag}){return <section className={'card '+(wide?'wide ':'')+(full?'full ':'')} data-search={(title+' '+desc+' '+(tag||'')).toLowerCase()}><h2>{title}</h2><div className="desc">{desc}</div>{children}</section>}
function Counter(){const [n,setN]=useAtom(countAtom);const d=useAtomValue(doubleAtom);const t=useAtomValue(tripleAtom);return <Card title="기본 atom + 파생 atom" desc="원자 상태 하나에서 2배·3배 값을 자동 계산"><div className="value">{n}</div><div className="row"><span className="pill">×2 = {d}</span><span className="pill">×3 = {t}</span></div><div className="row" style={{marginTop:12}}><button className="btn alt" onClick={()=>setN(n-1)}>−1</button><button className="btn" onClick={()=>setN(n+1)}>+1</button><button className="btn danger" onClick={()=>setN(0)}>초기화</button></div><div className="code">atom(0) → atom(get =&gt; get(countAtom) * 2)</div></Card>}
function WriteOnly(){const inc=useSetAtom(incrementAtom);const n=useAtomValue(countAtom);return <Card title="쓰기 전용 atom" desc="읽기 값 없이 여러 상태 변경 로직 캡슐화"><div className="value">{n}</div><div className="row"><button className="btn" onClick={()=>inc(5)}>+5</button><button className="btn alt" onClick={()=>inc(-3)}>−3</button></div><div className="code">atom(null, (get, set, amount) =&gt; ...)</div></Card>}
function TextDerived(){const [text,setText]=useAtom(textAtom);const upper=useAtomValue(upperAtom);return <Card title="문자열 파생 상태" desc="입력값 변화에 따라 읽기 전용 atom 즉시 갱신"><input className="input" value={text} onChange={e=>setText(e.target.value)}/><div className="value" style={{fontSize:26,marginTop:12}}>{upper}</div></Card>}
function Storage(){const [theme,setTheme]=useAtom(themeAtom);return <Card title="atomWithStorage" desc="localStorage 영속화 — 새로고침 후에도 유지"><div className="row"><span className="pill">현재: {theme}</span><button className="btn" onClick={()=>setTheme(theme==='light'?'dark':'light')}>테마 전환</button></div><div className="code">atomWithStorage('jotai-lab-theme', 'light')</div></Card>}
function Resettable(){const [v,setV]=useAtom(resettableAtom);return <Card title="atomWithReset + RESET" desc="어떤 값에서도 선언된 초기값으로 복원"><div className="value">{v}</div><input type="range" min="0" max="100" value={v} onChange={e=>setV(+e.target.value)} style={{width:'100%'}}/><button className="btn danger" onClick={()=>setV(RESET)}>RESET 심벌</button></Card>}
function Reducer(){const [s,dispatch]=useAtom(reducerAtom);return <Card title="atomWithReducer" desc="Redux 스타일 action/reducer 상태 전이"><div className="value">{s.count}</div><div className="row"><button className="btn" onClick={()=>dispatch({type:'inc'})}>+{s.step}</button><select className="input" style={{width:100}} value={s.step} onChange={e=>dispatch({type:'step',value:+e.target.value})}><option>1</option><option>2</option><option>5</option><option>10</option></select><button className="btn danger" onClick={()=>dispatch({type:'reset'})}>초기화</button></div></Card>}
function SelectDemo(){const [user,setUser]=useAtom(userAtom);const name=useAtomValue(userNameAtom);const [renders,setRenders]=useState(0);useEffect(()=>setRenders(r=>r+1),[name]);return <Card title="selectAtom" desc="큰 객체에서 필요한 조각만 구독해 렌더 범위 축소"><div className="stack"><input className="input" value={user.name} onChange={e=>setUser({...user,name:e.target.value})}/><input className="input" value={user.department} onChange={e=>setUser({...user,department:e.target.value})}/><span className="pill">이름 선택 구독 변경 횟수: {renders}</span></div></Card>}
function TodoItem({a}){const [todo,setTodo]=useAtom(a);return <div className={'todo '+(todo.done?'done':'')}><input type="checkbox" checked={todo.done} onChange={e=>setTodo({...todo,done:e.target.checked})}/><span>{todo.text}</span><button className="btn alt" onClick={()=>setTodo({...todo,text:todo.text+'!'})}>수정</button></div>}
function SplitTodos(){const [todoAtoms,dispatch]=useAtom(todoAtomsAtom);return <Card title="splitAtom" desc="배열의 각 항목을 독립 atom으로 분리" wide><div className="stack">{todoAtoms.map((a,i)=><TodoItem key={`${i}`} a={a}/>)}<button className="btn" onClick={()=>dispatch({type:'insert',value:{id:Date.now(),text:'새 작업',done:false}})}>항목 추가</button></div></Card>}
function Family(){const [id,setId]=useState(1);const [item,setItem]=useAtom(useMemo(()=>family(id),[id]));return <Card title="atomFamily" desc="매개변수별 atom 인스턴스 생성·캐시"><div className="row"><input className="input" style={{width:90}} type="number" min="1" value={id} onChange={e=>setId(+e.target.value)}/><span className="pill">ID {item.id}</span></div><div className="value">{item.score}</div><button className="btn" onClick={()=>setItem({...item,score:item.score+1})}>이 ID 점수 +1</button></Card>}
function AsyncContent(){const data=useAtomValue(asyncBaseAtom);return <div><div className="value" style={{fontSize:22}}>{data.time}</div><span>{data.message}</span></div>}
function AsyncSuspense(){return <Card title="비동기 atom + Suspense" desc="Promise를 반환하는 atom을 React Suspense로 처리"><Suspense fallback={<div className="skeleton"/>}><AsyncContent/></Suspense><div className="code">atom(async () =&gt; await fetch(...))</div></Card>}
function LoadableDemo(){const state=useAtomValue(loadableAsyncAtom);return <Card title="loadable" desc="Suspense 없이 loading / hasData / hasError 상태 분기">{state.state==='loading'?<div className="skeleton"/>:state.state==='hasError'?<div className="error">{String(state.error)}</div>:<div><span className="pill">hasData</span><p>{state.data.message}</p></div>}</Card>}
function RefreshValue(){const v=useAtomValue(refreshableAsyncAtom);return <div className="value">{v}</div>}
function RefreshAsync(){const refresh=useSetAtom(refreshAtom);return <Card title="의존성 기반 비동기 새로고침" desc="refresh atom 변경으로 비동기 파생 atom 재평가"><Suspense fallback={<div className="skeleton"/>}><RefreshValue/></Suspense><button className="btn" onClick={()=>refresh(v=>v+1)}>새 값 불러오기</button></Card>}
function Guarded(){const [v,setV]=useAtom(guardedAtom);return <Card title="검증 가능한 writable atom" desc="쓰기 함수에서 입력 범위를 0~100으로 강제"><div className="value">{v}</div><div className="row"><button className="btn alt" onClick={()=>setV(-999)}>−999 입력</button><button className="btn" onClick={()=>setV(999)}>999 입력</button></div><div className="meter"><i style={{width:v+'%'}}/></div></Card>}
function Frozen(){const [s,setS]=useAtom(frozenAtom);return <Card title="freezeAtom" desc="개발 중 상태 객체를 동결해 우발적 직접 변경 방지"><div className="row"><span className="pill">sound: {String(s.settings.sound)}</span><span className="pill">compact: {String(s.settings.compact)}</span></div><button className="btn" onClick={()=>setS({settings:{...s.settings,sound:!s.settings.sound}})}>불변 업데이트</button><div className="code">Object.isFrozen = {String(Object.isFrozen(s))}</div></Card>}
function VanillaStore(){const [v,setV]=useState(()=>store.get(countAtom));useEffect(()=>store.sub(countAtom,()=>setV(store.get(countAtom))),[]);return <Card title="createStore (Vanilla API)" desc="React 밖에서도 get / set / sub 사용"><div className="value">{v}</div><div className="row"><button className="btn" onClick={()=>store.set(countAtom,v+10)}>외부 store +10</button><span className="pill">Provider와 별도 저장소</span></div></Card>}
function MultipleProviders(){return <Card title="Provider 격리" desc="같은 atom 정의도 Provider별 독립 상태"><div className="row"><Provider><MiniCounter label="A"/></Provider><Provider><MiniCounter label="B"/></Provider></div></Card>}
function MiniCounter({label}){const [n,setN]=useAtom(countAtom);return <button className="btn alt" onClick={()=>setN(n+1)}>{label}: {n}</button>}
function DebugPanel(){const n=useAtomValue(countAtom), text=useAtomValue(textAtom), todos=useAtomValue(todosAtom);return <Card title="상태 스냅샷 / 디버그 패널" desc="여러 atom 값을 모아 실시간 JSON으로 관찰" full><pre className="log">{JSON.stringify({count:n,text,todos,updatedAt:new Date().toISOString()},null,2)}</pre></Card>}
function App(){const [q,setQ]=useState('');const [visible,setVisible]=useState(0);useEffect(()=>{const cards=[...document.querySelectorAll('.card')];let c=0;cards.forEach(el=>{const ok=el.dataset.search.includes(q.toLowerCase());el.classList.toggle('hidden',!ok);if(ok)c++});setVisible(c)},[q]);return <Provider><main className="app"><header className="hero"><h1>Jotai 종합 기능 실험실</h1><p>작고 조합 가능한 atom으로 React 상태를 설계하는 인터랙티브 샘플</p><div className="badges"><span className="badge">Jotai 2.20.1</span><span className="badge">React 19</span><span className="badge">단일 HTML</span><span className="badge">실시간 조작</span></div></header><div className="toolbar"><input className="search" placeholder="기능 검색: storage, async, split…" value={q} onChange={e=>setQ(e.target.value)}/><button onClick={()=>setQ('')}>전체 보기</button></div><div className="stats"><div className="stat"><b>18+</b><span>기능 데모</span></div><div className="stat"><b>{visible || 18}</b><span>현재 표시 카드</span></div><div className="stat"><b>0</b><span>빌드 도구 필요</span></div><div className="stat"><b>100%</b><span>브라우저 실행</span></div></div><div className="grid"><Counter/><WriteOnly/><TextDerived/><Storage/><Resettable/><Reducer/><SelectDemo/><SplitTodos/><Family/><AsyncSuspense/><LoadableDemo/><RefreshAsync/><Guarded/><Frozen/><VanillaStore/><MultipleProviders/><DebugPanel/></div><div className="footer">브라우저 개발자 도구의 Network·Console도 함께 보면 atom 갱신 흐름을 더 쉽게 확인할 수 있다.</div></main></Provider>}

window.addEventListener('error',e=>{document.getElementById('root').innerHTML=`<div style="margin:20px;padding:20px;background:#fff0f0;color:#9b1c1c;border-radius:12px;font-family:sans-serif"><h2>실행 오류</h2><pre style="white-space:pre-wrap">${e.message}</pre><p>인터넷 연결 및 CDN 접근 여부를 확인해 주세요.</p></div>`});
createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
