<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>d3-sankey 종합 기능 실험실</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#65708a;--line:#dce3ee;--accent:#2563eb;--accent2:#7c3aed;--danger:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.08)}
body.dark{--bg:#0d1321;--panel:#151d2d;--text:#edf2ff;--muted:#98a5bd;--line:#2a354a;--accent:#60a5fa;--accent2:#a78bfa;--danger:#fb7185;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(120deg,#172554,#312e81);color:#fff;box-shadow:var(--shadow)}
header h1{margin:0;font-size:20px} header p{margin:2px 0 0;color:#c7d2fe;font-size:12px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}
button,.file-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button:hover,.file-btn:hover{transform:translateY(-1px);border-color:var(--accent)} button.primary{background:var(--accent);border-color:var(--accent);color:white} button.danger{color:var(--danger)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;padding:14px;min-height:0}.sidebar,.main{min-height:0}.sidebar{overflow:auto;padding-right:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}.panel h2{font-size:14px;margin:0;padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel .body{padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px}.field input[type=range]{padding:0}.inline{display:flex;gap:7px;align-items:center}.inline>*{min-width:0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-rows:auto minmax(450px,1fr) auto;gap:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:10px;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.toolbar .spacer{flex:1}.toolbar input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:8px;min-width:180px}
.chart-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-height:450px}.chart-wrap{position:absolute;inset:0}.chart-wrap svg{display:block;width:100%;height:100%;touch-action:none}.empty{position:absolute;inset:0;display:none;place-items:center;color:var(--muted)}
.stats{position:absolute;left:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.chip{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;backdrop-filter:blur(7px)}
.legend{position:absolute;right:12px;top:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:180px;max-height:180px;overflow:auto;backdrop-filter:blur(7px)}.legend-row{display:flex;gap:7px;align-items:center;font-size:11px;margin:4px}.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.tooltip{position:fixed;z-index:10;pointer-events:none;opacity:0;background:#0f172a;color:#fff;border-radius:9px;padding:8px 10px;font-size:12px;max-width:270px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .1s}.tooltip strong{display:block;margin-bottom:3px}
.bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.table-wrap,.log{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.section-title{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}.table-scroll{max-height:210px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);z-index:1}.log pre{margin:0;padding:10px;max-height:210px;overflow:auto;color:var(--muted);font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
.node rect{stroke:rgba(15,23,42,.25);stroke-width:.7}.node text{font-size:12px;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;fill:var(--text);pointer-events:none}.link{fill:none;mix-blend-mode:multiply}.dark .link{mix-blend-mode:screen}.link:hover{stroke-opacity:.9!important}.focused{opacity:1!important}.dimmed{opacity:.08!important}.flow-animated{stroke-dasharray:10 8;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-18}}
.help{font-size:11px;color:var(--muted);margin-top:6px}.badge{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--bg);color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{max-height:none}.main{grid-template-rows:auto 70vh auto}.bottom{grid-template-columns:1fr}.legend{display:none}.header-actions{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>d3-sankey 종합 기능 실험실</h1><p>레이아웃 · 정렬 · 드래그 · 확대/축소 · 필터 · 색상 · 데이터 편집 · 내보내기</p></div><div class="header-actions"><button id="themeBtn">다크 모드</button><button id="resetAllBtn">전체 초기화</button></div></header>
<div class="layout">
<aside class="sidebar">
<section class="panel"><h2>데이터 <span class="badge">DAG 권장</span></h2><div class="body">
<div class="field"><label>예제 데이터</label><select id="dataset"><option value="energy">에너지 흐름</option><option value="budget">예산 배분</option><option value="journey">고객 여정</option></select></div>
<div class="grid2"><button id="randomBtn">무작위 DAG</button><label class="file-btn">JSON 불러오기<input id="fileInput" type="file" accept="application/json" hidden></label></div>
<div class="field" style="margin-top:9px"><label>JSON 직접 편집</label><textarea id="jsonEditor" rows="9" spellcheck="false"></textarea></div>
<div class="grid2"><button class="primary" id="applyJsonBtn">JSON 적용</button><button id="copyJsonBtn">JSON 복사</button></div>
<div class="help">형식: { nodes:[{id,name,group}], links:[{source,target,value}] }</div>
</div></section>
<section class="panel"><h2>레이아웃 설정</h2><div class="body">
<div class="field"><label>노드 정렬</label><select id="align"><option value="justify">Justify</option><option value="left">Left</option><option value="right">Right</option><option value="center">Center</option></select></div>
<div class="grid2"><div class="field"><label>노드 너비 <b id="nodeWidthVal"></b></label><input id="nodeWidth" type="range" min="6" max="50" value="22"></div><div class="field"><label>노드 간격 <b id="nodePaddingVal"></b></label><input id="nodePadding" type="range" min="2" max="60" value="18"></div></div>
<div class="grid2"><div class="field"><label>반복 횟수 <b id="iterationsVal"></b></label><input id="iterations" type="range" min="1" max="96" value="32"></div><div class="field"><label>최소 링크값 <b id="minLinkVal"></b></label><input id="minLink" type="range" min="0" max="30" value="0"></div></div>
<div class="field"><label>노드 순서</label><select id="nodeSort"><option value="auto">자동</option><option value="name">이름순</option><option value="value">값 큰 순</option><option value="reverse">값 작은 순</option></select></div>
<div class="field"><label>링크 순서</label><select id="linkSort"><option value="auto">자동</option><option value="value">값 큰 순</option><option value="target">대상 이름순</option></select></div>
</div></section>
<section class="panel"><h2>표현 설정</h2><div class="body">
<div class="grid2"><div class="field"><label>노드 색상</label><select id="nodeColor"><option value="group">그룹별</option><option value="depth">단계별</option><option value="value">값 기준</option><option value="custom">데이터 색상</option></select></div><div class="field"><label>링크 색상</label><select id="linkColor"><option value="source">출발 노드</option><option value="target">도착 노드</option><option value="gradient">그래디언트</option><option value="neutral">중립색</option></select></div></div>
<div class="grid2"><div class="field"><label>링크 투명도 <b id="opacityVal"></b></label><input id="opacity" type="range" min="10" max="90" value="42"></div><div class="field"><label>링크 곡률 <b id="curvatureVal"></b></label><input id="curvature" type="range" min="0" max="100" value="50"></div></div>
<div class="checks"><label class="check"><input id="showLabels" type="checkbox" checked>라벨</label><label class="check"><input id="showValues" type="checkbox" checked>값 표시</label><label class="check"><input id="showPercent" type="checkbox">비율 표시</label><label class="check"><input id="animateFlow" type="checkbox">흐름 애니메이션</label><label class="check"><input id="enableDrag" type="checkbox" checked>노드 드래그</label><label class="check"><input id="enableZoom" type="checkbox" checked>확대/이동</label><label class="check"><input id="showLegend" type="checkbox" checked>범례</label><label class="check"><input id="highlightPath" type="checkbox" checked>경로 강조</label></div>
</div></section>
<section class="panel"><h2>내보내기</h2><div class="body"><div class="grid2"><button id="svgBtn">SVG 저장</button><button id="pngBtn">PNG 저장</button><button id="dataBtn">JSON 저장</button><button id="fitBtn">화면 맞춤</button></div></div></section>
</aside>
<main class="main">
<div class="toolbar"><button id="rerenderBtn" class="primary">다시 그리기</button><button id="zoomInBtn">확대</button><button id="zoomOutBtn">축소</button><button id="resetZoomBtn">배율 초기화</button><div class="spacer"></div><input id="search" placeholder="노드 검색…" /><button id="clearSearchBtn">검색 해제</button></div>
<section class="chart-card" id="chartCard"><div class="chart-wrap"><svg id="chart" aria-label="Sankey diagram"></svg></div><div class="stats" id="stats"></div><div class="legend" id="legend"></div><div class="empty" id="empty">표시할 링크가 없어.</div></section>
<div class="bottom"><section class="table-wrap"><div class="section-title">링크 데이터</div><div class="table-scroll"><table><thead><tr><th>출발</th><th>도착</th><th>값</th><th>비율</th></tr></thead><tbody id="linkTable"></tbody></table></div></section><section class="log"><div class="section-title">이벤트 로그</div><pre id="log"></pre></section></div>
</main>
</div></div><div class="tooltip" id="tooltip"></div>
<script>
(() => {
'use strict';
const DATASETS={
energy:{nodes:[
{id:'solar',name:'태양광',group:'공급',color:'#f59e0b'},{id:'wind',name:'풍력',group:'공급',color:'#06b6d4'},{id:'gas',name:'가스',group:'공급',color:'#64748b'},{id:'grid',name:'전력망',group:'변환'},{id:'storage',name:'저장장치',group:'변환'},{id:'industry',name:'산업',group:'수요'},{id:'home',name:'가정',group:'수요'},{id:'transport',name:'교통',group:'수요'},{id:'loss',name:'손실',group:'손실'}],links:[
{source:'solar',target:'grid',value:42},{source:'wind',target:'grid',value:35},{source:'gas',target:'grid',value:28},{source:'solar',target:'storage',value:8},{source:'wind',target:'storage',value:10},{source:'storage',target:'grid',value:15},{source:'storage',target:'loss',value:3},{source:'grid',target:'industry',value:43},{source:'grid',target:'home',value:37},{source:'grid',target:'transport',value:23},{source:'grid',target:'loss',value:17}]},
budget:{nodes:[{id:'total',name:'총예산',group:'재원'},{id:'ops',name:'운영',group:'분야'},{id:'dev',name:'개발',group:'분야'},{id:'marketing',name:'마케팅',group:'분야'},{id:'infra',name:'인프라',group:'세부'},{id:'people',name:'인력',group:'세부'},{id:'software',name:'소프트웨어',group:'세부'},{id:'campaign',name:'캠페인',group:'세부'},{id:'reserve',name:'예비비',group:'잔여'}],links:[{source:'total',target:'ops',value:45},{source:'total',target:'dev',value:38},{source:'total',target:'marketing',value:12},{source:'total',target:'reserve',value:5},{source:'ops',target:'people',value:30},{source:'ops',target:'infra',value:15},{source:'dev',target:'people',value:15},{source:'dev',target:'software',value:23},{source:'marketing',target:'campaign',value:12}]},
journey:{nodes:[{id:'visit',name:'방문',group:'유입'},{id:'search',name:'검색',group:'탐색'},{id:'detail',name:'상세보기',group:'탐색'},{id:'cart',name:'장바구니',group:'전환'},{id:'signup',name:'회원가입',group:'전환'},{id:'buy',name:'구매',group:'결과'},{id:'leave1',name:'초기 이탈',group:'이탈'},{id:'leave2',name:'탐색 이탈',group:'이탈'},{id:'leave3',name:'결제 이탈',group:'이탈'}],links:[{source:'visit',target:'search',value:70},{source:'visit',target:'detail',value:20},{source:'visit',target:'leave1',value:10},{source:'search',target:'detail',value:48},{source:'search',target:'leave2',value:22},{source:'detail',target:'cart',value:41},{source:'detail',target:'signup',value:15},{source:'detail',target:'leave2',value:12},{source:'signup',target:'cart',value:11},{source:'signup',target:'leave3',value:4},{source:'cart',target:'buy',value:36},{source:'cart',target:'leave3',value:16}]}
};
const $=s=>document.querySelector(s), svg=d3.select('#chart'), tooltip=$('#tooltip'), logEl=$('#log');
let raw=clone(DATASETS.energy), graph=null, zoomBehavior, currentTransform=d3.zoomIdentity;
const fmt=d3.format(',.1f'), colorOrdinal=d3.scaleOrdinal(d3.schemeTableau10);
function clone(x){return JSON.parse(JSON.stringify(x))}
function log(msg){const t=new Date().toLocaleTimeString();logEl.textContent=`[${t}] ${msg}\n`+logEl.textContent.split('\n').slice(0,24).join('\n')}
function setEditor(){ $('#jsonEditor').value=JSON.stringify(raw,null,2) }
function validate(data){if(!data||!Array.isArray(data.nodes)||!Array.isArray(data.links))throw Error('nodes와 links 배열이 필요해.');const ids=new Set();data.nodes.forEach((n,i)=>{const id=n.id??n.name;if(id==null)throw Error(`nodes[${i}]에 id 또는 name이 필요해.`);if(ids.has(String(id)))throw Error(`중복 노드 ID: ${id}`);ids.add(String(id));n.id=String(id);n.name=n.name??String(id)});data.links.forEach((l,i)=>{if(!ids.has(String(l.source))||!ids.has(String(l.target)))throw Error(`links[${i}]의 source/target이 존재하지 않아.`);if(!(Number(l.value)>0))throw Error(`links[${i}].value는 0보다 커야 해.`);l.value=Number(l.value)});return data}
function alignFn(){return {justify:d3.sankeyJustify,left:d3.sankeyLeft,right:d3.sankeyRight,center:d3.sankeyCenter}[$('#align').value]}
function nodeSortFn(){const v=$('#nodeSort').value;return v==='name'?(a,b)=>d3.ascending(a.name,b.name):v==='value'?(a,b)=>d3.descending(a.value,b.value):v==='reverse'?(a,b)=>d3.ascending(a.value,b.value):undefined}
function linkSortFn(){const v=$('#linkSort').value;return v==='value'?(a,b)=>d3.descending(a.value,b.value):v==='target'?(a,b)=>d3.ascending(a.target.name,b.target.name):undefined}
function nodeColor(d,maxDepth,maxValue){const mode=$('#nodeColor').value;if(mode==='custom'&&d.color)return d.color;if(mode==='depth')return d3.interpolateTurbo(maxDepth?d.depth/maxDepth:0);if(mode==='value')return d3.interpolateBlues(.25+.7*(d.value/maxValue));return colorOrdinal(d.group??d.name)}
function curvedPath(curve){return d=>{const x0=d.source.x1,x1=d.target.x0,xi=d3.interpolateNumber(x0,x1),x2=xi(curve),x3=xi(1-curve);return `M${x0},${d.y0}C${x2},${d.y0} ${x3},${d.y1} ${x1},${d.y1}`}}
function render(preserveZoom=true){
const card=$('#chartCard'),width=Math.max(500,card.clientWidth),height=Math.max(420,card.clientHeight);svg.attr('viewBox',`0 0 ${width} ${height}`);svg.selectAll('*').remove();
let data=clone(raw);const min=+$(`#minLink`).value;data.links=data.links.filter(l=>+l.value>=min);const used=new Set(data.links.flatMap(l=>[String(l.source),String(l.target)]));data.nodes=data.nodes.filter(n=>used.has(String(n.id)));
$('#empty').style.display=data.links.length?'none':'grid';if(!data.links.length){updateStats(null);updateTable(null);return}
try{
const sankey=d3.sankey().nodeId(d=>d.id).nodeWidth(+$(`#nodeWidth`).value).nodePadding(+$(`#nodePadding`).value).nodeAlign(alignFn()).iterations(+$(`#iterations`).value).extent([[25,35],[width-25,height-35]]);
const ns=nodeSortFn(),ls=linkSortFn();if(ns)sankey.nodeSort(ns);if(ls)sankey.linkSort(ls);graph=sankey(data);
const defs=svg.append('defs'),root=svg.append('g').attr('class','zoom-root');const maxDepth=d3.max(graph.nodes,d=>d.depth)||1,maxValue=d3.max(graph.nodes,d=>d.value)||1;
graph.nodes.forEach(d=>d._color=nodeColor(d,maxDepth,maxValue));
const mode=$('#linkColor').value;if(mode==='gradient')graph.links.forEach((d,i)=>{const id=`grad-${i}`;const g=defs.append('linearGradient').attr('id',id).attr('gradientUnits','userSpaceOnUse').attr('x1',d.source.x1).attr('x2',d.target.x0);g.append('stop').attr('stop-color',d.source._color);g.append('stop').attr('offset','100%').attr('stop-color',d.target._color);d._stroke=`url(#${id})`});
const curve=+$(`#curvature`).value/100, path=curvedPath(curve);const links=root.append('g').attr('class','links').selectAll('path').data(graph.links).join('path').attr('class',`link${$('#animateFlow').checked?' flow-animated':''}`).attr('d',path).attr('stroke',d=>mode==='gradient'?d._stroke:mode==='source'?d.source._color:mode==='target'?d.target._color:'#94a3b8').attr('stroke-width',d=>Math.max(1,d.width)).attr('stroke-opacity',+$(`#opacity`).value/100)
.on('pointerenter',(e,d)=>{showTip(e,`<strong>${d.source.name} → ${d.target.name}</strong>값 ${fmt(d.value)} · 전체의 ${fmt(d.value/d3.sum(graph.links,x=>x.value)*100)}%`);if($('#highlightPath').checked)focus(d)}).on('pointermove',moveTip).on('pointerleave',()=>{hideTip();clearFocus()});
const nodes=root.append('g').selectAll('g').data(graph.nodes).join('g').attr('class','node').attr('transform',d=>`translate(${d.x0},${d.y0})`).style('cursor',$('#enableDrag').checked?'ns-resize':'default')
.on('pointerenter',(e,d)=>{showTip(e,`<strong>${d.name}</strong>유입 ${fmt(d3.sum(d.targetLinks,x=>x.value))} · 유출 ${fmt(d3.sum(d.sourceLinks,x=>x.value))}<br>노드값 ${fmt(d.value)} · depth ${d.depth} / layer ${d.layer}`);if($('#highlightPath').checked)focus(d)}).on('pointermove',moveTip).on('pointerleave',()=>{hideTip();clearFocus()});
nodes.append('rect').attr('width',d=>d.x1-d.x0).attr('height',d=>Math.max(1,d.y1-d.y0)).attr('rx',2).attr('fill',d=>d._color);
if($('#showLabels').checked){const total=d3.sum(graph.links,d=>d.value);nodes.append('text').attr('x',d=>d.x0<width/2?(d.x1-d.x0)+7:-7).attr('y',d=>(d.y1-d.y0)/2).attr('dy','.35em').attr('text-anchor',d=>d.x0<width/2?'start':'end').text(d=>{let s=d.name;if($('#showValues').checked)s+=` ${fmt(d.value)}`;if($('#showPercent').checked)s+=` (${fmt(d.value/total*100)}%)`;return s})}
if($('#enableDrag').checked)nodes.call(d3.drag().subject(d=>d).on('start',function(){this.parentNode.appendChild(this)}).on('drag',(e,d)=>{const h=d.y1-d.y0;d.y0=Math.max(35,Math.min(height-35-h,e.y-h/2));d.y1=d.y0+h;d3.sankey().update(graph);nodes.attr('transform',n=>`translate(${n.x0},${n.y0})`);links.attr('d',path);log(`노드 이동: ${d.name}`)}));
zoomBehavior=d3.zoom().scaleExtent([.35,5]).on('zoom',e=>{currentTransform=e.transform;root.attr('transform',e.transform)});svg.on('.zoom',null);if($('#enableZoom').checked)svg.call(zoomBehavior);if(preserveZoom&&$('#enableZoom').checked)svg.call(zoomBehavior.transform,currentTransform);else currentTransform=d3.zoomIdentity;
updateStats(graph);updateLegend(graph);updateTable(graph);applySearch();log(`렌더링 완료: 노드 ${graph.nodes.length}, 링크 ${graph.links.length}`)
}catch(err){graph=null;$('#empty').style.display='grid';$('#empty').textContent='렌더링 오류: '+err.message;log('오류: '+err.message)}
}
function showTip(e,html){tooltip.innerHTML=html;tooltip.style.opacity=1;moveTip(e)}function moveTip(e){tooltip.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tooltip.style.top=Math.min(innerHeight-90,e.clientY+14)+'px'}function hideTip(){tooltip.style.opacity=0}
function focus(x){const related=new Set();if(x.source&&x.target){related.add(x);related.add(x.source);related.add(x.target)}else{related.add(x);x.sourceLinks.forEach(l=>{related.add(l);related.add(l.target)});x.targetLinks.forEach(l=>{related.add(l);related.add(l.source)})}svg.selectAll('.node,.link').classed('dimmed',d=>!related.has(d)).classed('focused',d=>related.has(d))}function clearFocus(){svg.selectAll('.node,.link').classed('dimmed',false).classed('focused',false);applySearch()}
function applySearch(){if(!graph)return;const q=$('#search').value.trim().toLowerCase();if(!q)return;const matched=new Set(graph.nodes.filter(n=>n.name.toLowerCase().includes(q)));svg.selectAll('.node').classed('dimmed',d=>!matched.has(d));svg.selectAll('.link').classed('dimmed',d=>!matched.has(d.source)&&!matched.has(d.target))}
function updateStats(g){const el=$('#stats');if(!g){el.innerHTML='';return}const total=d3.sum(g.links,d=>d.value),max=d3.max(g.links,d=>d.value);el.innerHTML=`<span class="chip">노드 ${g.nodes.length}</span><span class="chip">링크 ${g.links.length}</span><span class="chip">총 흐름 ${fmt(total)}</span><span class="chip">최대 링크 ${fmt(max)}</span>`}
function updateLegend(g){const el=$('#legend');el.style.display=$('#showLegend').checked?'block':'none';if(!g)return;const groups=[...new Map(g.nodes.map(n=>[n.group??n.name,n._color])).entries()];el.innerHTML='<b style="font-size:11px">노드 범례</b>'+groups.map(([k,c])=>`<div class="legend-row"><span class="swatch" style="background:${c}"></span>${k}</div>`).join('')}
function updateTable(g){const tb=$('#linkTable');if(!g){tb.innerHTML='';return}const total=d3.sum(g.links,d=>d.value);tb.innerHTML=[...g.links].sort((a,b)=>b.value-a.value).map(d=>`<tr><td>${d.source.name}</td><td>${d.target.name}</td><td>${fmt(d.value)}</td><td>${fmt(d.value/total*100)}%</td></tr>`).join('')}
function updateLabels(){['nodeWidth','nodePadding','iterations','minLink','opacity','curvature'].forEach(id=>$('#'+id+'Val').textContent=$('#'+id).value)}
function randomDAG(){const layers=4,nodes=[],links=[];for(let l=0;l<layers;l++){const count=2+Math.floor(Math.random()*3);for(let i=0;i<count;i++)nodes.push({id:`L${l}-${i}`,name:`단계${l+1}-${i+1}`,group:`단계 ${l+1}`})}for(let l=0;l<layers-1;l++){const a=nodes.filter(n=>n.id.startsWith(`L${l}-`)),b=nodes.filter(n=>n.id.startsWith(`L${l+1}-`));a.forEach(s=>{b.forEach(t=>{if(Math.random()<.55)links.push({source:s.id,target:t.id,value:5+Math.floor(Math.random()*36)})})});if(!links.some(x=>a.some(n=>n.id===x.source)))links.push({source:a[0].id,target:b[0].id,value:20})}raw={nodes,links};setEditor();render(false);log('무작위 비순환 그래프 생성')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportSVG(){const s=svg.node().cloneNode(true);s.setAttribute('xmlns','http://www.w3.org/2000/svg');const css=`text{font-family:Arial,sans-serif}.link{fill:none}.node rect{stroke:#334155;stroke-width:.7}`;const st=document.createElementNS('http://www.w3.org/2000/svg','style');st.textContent=css;s.insertBefore(st,s.firstChild);download('d3-sankey.svg',new XMLSerializer().serializeToString(s),'image/svg+xml')}
function exportPNG(){const xml=new XMLSerializer().serializeToString(svg.node()),blob=new Blob([xml],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const vb=svg.attr('viewBox').split(' ').map(Number),canvas=document.createElement('canvas');canvas.width=vb[2]*2;canvas.height=vb[3]*2;const c=canvas.getContext('2d');c.fillStyle=getComputedStyle(document.body).getPropertyValue('--panel').trim()||'#fff';c.fillRect(0,0,canvas.width,canvas.height);c.scale(2,2);c.drawImage(img,0,0,vb[2],vb[3]);URL.revokeObjectURL(url);canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='d3-sankey.png';a.click()},'image/png')};img.src=url}
function zoomBy(k){if(zoomBehavior&&$('#enableZoom').checked)svg.transition().duration(200).call(zoomBehavior.scaleBy,k)}
$('#dataset').onchange=e=>{raw=clone(DATASETS[e.target.value]);setEditor();render(false)};$('#randomBtn').onclick=randomDAG;$('#applyJsonBtn').onclick=()=>{try{raw=validate(JSON.parse($('#jsonEditor').value));setEditor();render(false);log('편집 JSON 적용')}catch(e){alert(e.message);log('JSON 오류: '+e.message)}};$('#copyJsonBtn').onclick=async()=>{await navigator.clipboard.writeText($('#jsonEditor').value);log('JSON 클립보드 복사')};$('#fileInput').onchange=async e=>{try{raw=validate(JSON.parse(await e.target.files[0].text()));setEditor();render(false)}catch(err){alert(err.message)}};
['align','nodeSort','linkSort','nodeColor','linkColor','showLabels','showValues','showPercent','animateFlow','enableDrag','enableZoom','showLegend','highlightPath'].forEach(id=>$('#'+id).onchange=()=>render());['nodeWidth','nodePadding','iterations','minLink','opacity','curvature'].forEach(id=>$('#'+id).oninput=()=>{updateLabels();render()});
$('#rerenderBtn').onclick=()=>render();$('#search').oninput=()=>{clearFocus();applySearch()};$('#clearSearchBtn').onclick=()=>{$('#search').value='';clearFocus()};$('#zoomInBtn').onclick=()=>zoomBy(1.3);$('#zoomOutBtn').onclick=()=>zoomBy(1/1.3);$('#resetZoomBtn').onclick=()=>{if(zoomBehavior)svg.transition().call(zoomBehavior.transform,d3.zoomIdentity)};$('#fitBtn').onclick=$('#resetZoomBtn').onclick;$('#svgBtn').onclick=exportSVG;$('#pngBtn').onclick=exportPNG;$('#dataBtn').onclick=()=>download('d3-sankey-data.json',JSON.stringify(raw,null,2),'application/json');
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('#themeBtn').textContent=document.body.classList.contains('dark')?'라이트 모드':'다크 모드';render()};$('#resetAllBtn').onclick=()=>{location.reload()};
new ResizeObserver(()=>render()).observe($('#chartCard'));updateLabels();setEditor();render(false);
})();
</script>
</body></html>
