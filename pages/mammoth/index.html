<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>데모 보기</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f6f8; }
  #tab-bar {
    display: none;
    gap: 4px;
    padding: 8px 12px 0;
    background: #eef0f3;
    border-bottom: 1px solid #ddd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    box-sizing: border-box;
  }
  #tab-bar button {
    padding: 8px 16px;
    border: 1px solid #ddd;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: #f5f6f8;
    color: #555;
    font-size: 13px;
    cursor: pointer;
  }
  #tab-bar button.active { background: #fff; color: #205fb0; font-weight: 600; }
  #frame-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #frame-wrap.with-tabs { top: 41px; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
<div id="tab-bar"></div>
<div id="frame-wrap"><iframe id="content-frame"></iframe></div>
<script>
(async function () {
  // 소스별 하위 폴더 규칙: pages/<slug>/<source>/index.html
  // 이 파일은 모든 라이브러리 페이지가 공유하는 범용 탭 껍데기라 슬러그를 몰라도 됨(상대경로만 사용).
  const sources = [
    { key: 'claude', label: 'Claude' },
    { key: 'chatgpt', label: 'ChatGPT' },
  ];

  const available = [];
  for (const s of sources) {
    try {
      const res = await fetch('./' + s.key + '/index.html', { method: 'HEAD' });
      if (res.ok) available.push(s);
    } catch (e) {
      // 무시하고 다음 소스 확인
    }
  }

  const tabBar = document.getElementById('tab-bar');
  const frame = document.getElementById('content-frame');
  const frameWrap = document.getElementById('frame-wrap');

  if (available.length === 0) {
    document.body.innerHTML = '<p style="font-family:sans-serif; padding:20px; color:#a15c00;">데모 파일을 찾을 수 없습니다 (claude/index.html 또는 chatgpt/index.html 필요).</p>';
    return;
  }

  try {
    const metaRes = await fetch('./meta.json');
    if (metaRes.ok) {
      const meta = await metaRes.json();
      if (meta.name) document.title = meta.name;
    }
  } catch (e) {
    // 제목 갱신 실패는 무시
  }

  if (available.length > 1) {
    tabBar.style.display = 'flex';
    frameWrap.classList.add('with-tabs');
    available.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => {
        frame.src = './' + s.key + '/index.html';
        tabBar.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
      tabBar.appendChild(btn);
    });
  }

  frame.src = './' + available[0].key + '/index.html';
})();
</script>
</body>
</html>
