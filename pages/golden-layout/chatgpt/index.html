<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Layout 종합 기능 샘플</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/goldenlayout-base.css">
  <link id="gl-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/themes/goldenlayout-dark-theme.css">
  <style>
    :root{--bg:#09111f;--panel:#111c2e;--panel2:#17253b;--text:#e8eef8;--muted:#91a0b8;--line:#2a3b55;--accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--danger:#fb7185;--shadow:0 14px 40px rgba(0,0,0,.28)}
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    body.light{--bg:#eef3f9;--panel:#fff;--panel2:#f5f8fc;--text:#172033;--muted:#66758e;--line:#d8e0eb;--accent:#2563eb;--shadow:0 12px 35px rgba(38,54,78,.13)}
    button,select,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
    .topbar{display:flex;gap:12px;align-items:center;padding:10px 14px;background:linear-gradient(90deg,#111d31,#0d1728);border-bottom:1px solid var(--line)}
    body.light .topbar{background:#fff}.brand{display:flex;align-items:center;gap:10px;min-width:255px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f6c453,#c98512);display:grid;place-items:center;color:#261900;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
    .brand strong{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
    .btn,.select{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:#fecdd3}.btn:disabled{opacity:.45;cursor:not-allowed}.select{cursor:pointer}
    .subbar{display:flex;gap:8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.badge b{color:var(--text)}
    #layout-root{position:relative;min-height:0;background:var(--bg)}#layout-container{position:absolute;inset:0}
    .statusbar{height:28px;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}.statusbar span:last-child{margin-left:auto}
    .component{height:100%;width:100%;overflow:auto;background:var(--panel);color:var(--text);padding:12px}.component h3{font-size:13px;margin:0 0 10px}.component p{font-size:12px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}.metric{font-size:23px;font-weight:800;margin-top:5px}.up{color:var(--ok)}.down{color:var(--danger)}
    .tree ul{list-style:none;padding-left:15px;margin:5px 0}.tree li{padding:4px 5px;border-radius:5px;font-size:12px;cursor:pointer}.tree li:hover{background:var(--panel2)}.tree .folder::before{content:'▾ ';color:var(--warn)}.tree .file::before{content:'• ';color:var(--accent)}
    .editor{height:calc(100% - 27px);width:100%;resize:none;border:1px solid var(--line);background:#08101d;color:#d6e2f4;border-radius:8px;padding:12px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}body.light .editor{background:#f7f9fc;color:#172033}
    .console{font:12px/1.55 ui-monospace,Consolas,monospace}.console div{padding:3px 0}.console .info{color:#93c5fd}.console .success{color:#6ee7b7}.console .warn{color:#fde68a}
    .chart{height:180px;display:flex;align-items:end;gap:7px;padding:12px 5px 4px;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(#60a5fa,#2563eb);border-radius:5px 5px 0 0;min-width:10px;position:relative}.bar:hover::after{content:attr(data-v);position:absolute;left:50%;top:-25px;transform:translateX(-50%);background:#000;color:#fff;padding:3px 5px;border-radius:4px;font-size:10px}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);position:sticky;top:0;background:var(--panel)}.pill{font-size:10px;padding:3px 6px;border-radius:999px;background:rgba(52,211,153,.14);color:var(--ok)}
    .form-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:12px}.field{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:7px}.checklist label{display:block;padding:6px;border-bottom:1px solid var(--line);font-size:12px}.help kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
    dialog{width:min(760px,92vw);border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.6)}.modal-head,.modal-foot{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.modal-foot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end}.modal-body{padding:14px}.modal-body textarea{width:100%;height:330px;background:#08101d;color:#d6e2f4;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 monospace}
    .toast{position:fixed;right:18px;bottom:42px;padding:10px 14px;background:#111827;color:#fff;border:1px solid #334155;border-radius:9px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:9999}.toast.show{opacity:1;transform:none}
    .lm_content{background:var(--panel)!important}.lm_header{background:var(--panel2)!important}.lm_tab{font-family:inherit!important}.lm_splitter{background:var(--line)!important;opacity:.75}.lm_splitter:hover{background:var(--accent)!important}.lm_maximised .lm_header{box-shadow:0 2px 0 var(--accent)}
    @media(max-width:900px){.brand{min-width:auto}.brand small,.subbar .hint{display:none}.topbar{align-items:flex-start}.toolbar{max-height:84px;overflow:auto}.statusbar span:nth-child(2){display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">GL</div><div><strong>Golden Layout Feature Lab</strong><small>도킹 · 탭 · 리사이즈 · 저장/복원 종합 샘플</small></div></div>
    <div class="toolbar">
      <select id="preset" class="select" title="레이아웃 프리셋">
        <option value="ide">IDE 작업공간</option><option value="dashboard">대시보드</option><option value="analysis">분석 화면</option><option value="minimal">최소 구성</option>
      </select>
      <button class="btn primary" id="applyPreset">프리셋 적용</button>
      <button class="btn" id="addPanel">＋ 패널 추가</button>
      <button class="btn" id="addStack">＋ 탭 묶음</button>
      <button class="btn" id="save">저장</button><button class="btn" id="restore">복원</button>
      <button class="btn" id="json">JSON</button><button class="btn" id="popout">팝아웃</button>
      <button class="btn danger" id="closeFocused">선택 닫기</button>
    </div>
    <div class="spacer"></div><button class="btn" id="theme">☀ 테마</button>
  </header>
  <div class="subbar">
    <span class="badge">Golden Layout <b>2.6.0</b></span><span class="badge">컴포넌트 <b id="componentCount">0</b></span><span class="badge">포커스 <b id="focusName">없음</b></span><span class="hint" style="color:var(--muted);font-size:11px">탭 드래그로 이동 · 분할선 드래그로 크기 조절 · 탭 더블클릭으로 최대화</span>
  </div>
  <main id="layout-root"><div id="layout-container"></div></main>
  <footer class="statusbar"><span id="status">준비됨</span><span>Ctrl+S 저장 · Ctrl+Shift+R 복원 · Ctrl+N 패널 추가</span><span id="clock"></span></footer>
</div>
<dialog id="jsonDialog"><div class="modal-head"><strong>레이아웃 JSON 편집기</strong><span style="margin-left:auto;color:var(--muted);font-size:11px">현재 레이아웃을 복사하거나 수정 후 적용</span></div><div class="modal-body"><textarea id="jsonText"></textarea></div><div class="modal-foot"><button class="btn" id="copyJson">복사</button><button class="btn" id="downloadJson">다운로드</button><button class="btn" id="closeJson">닫기</button><button class="btn primary" id="applyJson">JSON 적용</button></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
import { GoldenLayout, LayoutConfig, LogicalZIndex } from 'https://esm.sh/golden-layout@2.6.0';

const container = document.getElementById('layout-container');
const themeLink = document.getElementById('gl-theme');
const state = { gl:null, focused:null, seq:1, logs:[], theme:'dark' };
const $ = id => document.getElementById(id);
const toast = msg => { $('toast').textContent=msg; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),1600); };
const log = (msg,type='info') => { state.logs.unshift({msg,type,time:new Date().toLocaleTimeString('ko-KR')}); state.logs=state.logs.slice(0,30); document.querySelectorAll('[data-console]').forEach(renderConsole); $('status').textContent=msg; };

const presets = {
  ide:{ root:{type:'row',content:[
    {type:'stack',width:20,content:[{type:'component',componentType:'explorer',title:'탐색기',componentState:{path:'/workspace'}}]},
    {type:'column',width:55,content:[
      {type:'stack',height:68,content:[{type:'component',componentType:'editor',title:'app.js',componentState:{file:'app.js'}},{type:'component',componentType:'preview',title:'미리보기'}]},
      {type:'stack',height:32,content:[{type:'component',componentType:'console',title:'콘솔'},{type:'component',componentType:'table',title:'데이터'}]}
    ]},
    {type:'stack',width:25,content:[{type:'component',componentType:'properties',title:'속성'},{type:'component',componentType:'help',title:'도움말'}]}
  ]}},
  dashboard:{root:{type:'column',content:[
    {type:'row',height:36,content:[{type:'component',componentType:'metrics',title:'핵심 지표'},{type:'component',componentType:'chart',title:'월별 추이'}]},
    {type:'row',height:64,content:[{type:'component',componentType:'table',title:'거래 현황'},{type:'stack',content:[{type:'component',componentType:'tasks',title:'할 일'},{type:'component',componentType:'console',title:'이벤트 로그'}]}]}
  ]}},
  analysis:{root:{type:'row',content:[
    {type:'column',width:65,content:[{type:'component',componentType:'chart',title:'분석 차트'},{type:'component',componentType:'table',title:'원본 데이터'}]},
    {type:'stack',width:35,content:[{type:'component',componentType:'properties',title:'필터'},{type:'component',componentType:'metrics',title:'요약'},{type:'component',componentType:'help',title:'설명'}]}
  ]}},
  minimal:{root:{type:'stack',content:[{type:'component',componentType:'welcome',title:'시작하기'}]}}
};

function el(html){const d=document.createElement('div');d.className='component';d.innerHTML=html;return d;}
function componentFactory(type,container,item){
  let root;
  if(type==='explorer') root=el(`<h3>프로젝트 탐색기</h3><div class="tree"><ul><li class="folder">src<ul><li class="file">app.js</li><li class="file">layout.js</li><li class="file">theme.css</li></ul></li><li class="folder">assets<ul><li class="file">logo.svg</li><li class="file">sample.json</li></ul></li><li class="file">index.html</li><li class="file">README.md</li></ul></div>`);
  else if(type==='editor') root=el(`<h3>코드 편집기 <span class="pill">수정 가능</span></h3><textarea class="editor" spellcheck="false">const layout = new GoldenLayout(container);\n\nlayout.registerComponentFactoryFunction(\n  'demo',\n  (container, state) => {\n    container.element.innerHTML = state.message;\n  }\n);\n\nlayout.loadLayout(config);</textarea>`);
  else if(type==='preview') root=el(`<h3>실시간 미리보기</h3><div class="card" style="height:calc(100% - 26px);display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(96,165,250,.28),transparent 40%),var(--panel2)"><div style="text-align:center"><div style="font-size:50px">◫</div><strong>드래그 가능한 작업공간</strong><p>탭을 다른 영역으로 옮기거나 가장자리에 놓아<br>행·열 분할을 만들어 보세요.</p><button class="btn primary" data-add-demo>새 패널 열기</button></div></div>`);
  else if(type==='console') root=el(`<h3>이벤트 콘솔</h3><div class="console" data-console></div>`);
  else if(type==='metrics') root=el(`<h3>핵심 지표</h3><div class="grid"><div class="card"><small>매출</small><div class="metric">₩ 8.42억</div><small class="up">▲ 12.4%</small></div><div class="card"><small>사용자</small><div class="metric">12,840</div><small class="up">▲ 7.1%</small></div><div class="card"><small>이탈률</small><div class="metric">18.6%</div><small class="down">▲ 1.8%</small></div><div class="card"><small>가동률</small><div class="metric">99.97%</div><small class="up">정상</small></div></div>`);
  else if(type==='chart') root=el(`<h3>월별 데이터 차트</h3><div class="chart">${[38,52,46,72,66,84,59,91,78,96,82,100].map((v,i)=>`<div class="bar" style="height:${v}%" data-v="${i+1}월 · ${v}"></div>`).join('')}</div><p>CSS 기반 경량 차트. 실제 프로젝트에서는 ECharts, Plotly.js 등과 결합 가능.</p>`);
  else if(type==='table') root=el(`<h3>데이터 테이블</h3><table><thead><tr><th>ID</th><th>프로젝트</th><th>담당</th><th>상태</th><th>진행률</th></tr></thead><tbody>${[['GL-101','통합 대시보드','김하늘','진행','78%'],['GL-102','레이아웃 저장','이민수','완료','100%'],['GL-103','팝아웃 테스트','박서준','검토','64%'],['GL-104','모바일 최적화','최유진','진행','42%'],['GL-105','테마 구성','정도윤','대기','15%']].map(r=>`<tr>${r.map((c,i)=>`<td>${i===3?`<span class="pill">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
  else if(type==='properties') root=el(`<h3>컴포넌트 속성</h3><div class="form-row"><label>제목</label><input class="field" value="${item.title||'패널'}"></div><div class="form-row"><label>최소 너비</label><input class="field" type="number" value="120"></div><div class="form-row"><label>닫기 허용</label><select class="field"><option>예</option><option>아니오</option></select></div><div class="form-row"><label>설명</label><textarea class="field" rows="5">Golden Layout 컴포넌트 상태 예시</textarea></div><button class="btn primary" data-rename>현재 탭 이름 변경</button>`);
  else if(type==='tasks') root=el(`<h3>체크리스트</h3><div class="checklist">${['탭 드래그 이동','분할선 크기 조절','탭 최대화/복원','레이아웃 저장','JSON 내보내기','팝아웃 창 확인'].map((x,i)=>`<label><input type="checkbox" ${i<2?'checked':''}> ${x}</label>`).join('')}</div>`);
  else if(type==='help') root=el(`<h3>기능 안내</h3><div class="help"><p><kbd>드래그</kbd> 탭 위치 이동 및 화면 분할</p><p><kbd>더블클릭</kbd> 선택 스택 최대화/복원</p><p><kbd>Ctrl+S</kbd> localStorage에 레이아웃 저장</p><p><kbd>Ctrl+Shift+R</kbd> 저장 레이아웃 복원</p><p><kbd>Ctrl+N</kbd> 동적 패널 추가</p><p>팝아웃은 브라우저 팝업 차단 설정의 영향을 받습니다.</p></div>`);
  else root=el(`<div class="empty"><div><div style="font-size:54px">✦</div><h3>${item.title||'Golden Layout'}</h3><p>새 컴포넌트 #${state.seq}<br>드래그하여 원하는 위치에 도킹하세요.</p><button class="btn" data-random-title>제목 변경</button></div></div>`);
  root.dataset.componentType=type;
  root.addEventListener('pointerdown',()=>{state.focused=item; $('focusName').textContent=item.title||type;});
  root.querySelector('[data-add-demo]')?.addEventListener('click',addPanel);
  root.querySelector('[data-random-title]')?.addEventListener('click',()=>{item.setTitle?.('동적 패널 '+(++state.seq));});
  root.querySelector('[data-rename]')?.addEventListener('click',()=>{item.setTitle?.('속성 변경 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));});
  if(type==='console') renderConsole(root.querySelector('[data-console]'));
  container.element.appendChild(root);
  updateCount(); log(`컴포넌트 생성: ${item.title||type}`,'success');
  return root;
}
function renderConsole(target){target.innerHTML=state.logs.map(x=>`<div class="${x.type}">[${x.time}] ${x.msg}</div>`).join('')||'<div>이벤트 대기 중...</div>';}
function register(gl){['explorer','editor','preview','console','metrics','chart','table','properties','tasks','help','welcome','dynamic'].forEach(type=>gl.registerComponentFactoryFunction(type,(c,s,item)=>componentFactory(type,c,item)));
  gl.on('stateChanged',()=>{updateCount(); $('status').textContent='레이아웃 상태 변경됨';});
  gl.on('itemCreated',e=>{ const item=e?.item||e; if(item?.element) item.element.addEventListener?.('dblclick',ev=>{ if(ev.target.closest('.lm_header')) item.parent?.toggleMaximise?.(); }); });
  gl.on('beforeComponentRelease',item=>log(`컴포넌트 닫힘: ${item.title||'패널'}`,'warn'));
  gl.on('windowOpened',()=>log('팝아웃 창 열림','success'));
  gl.on('windowClosed',()=>log('팝아웃 창 닫힘','warn'));
}
function create(config){
  if(state.gl){try{state.gl.destroy()}catch(e){console.warn(e)}}
  container.innerHTML=''; const gl=new GoldenLayout(container); state.gl=gl; register(gl); gl.loadLayout(config); fit(); updateCount(); log('레이아웃 로드 완료','success');
}
function fit(){if(state.gl){state.gl.setSize(container.clientWidth,container.clientHeight)}}
function updateCount(){if(!state.gl)return; let n=0; state.gl.rootItem?.getAllContentItems?.().forEach?.(x=>{if(x.isComponent)n++}); $('componentCount').textContent=n;}
function resolvedConfig(){return LayoutConfig.fromResolved(state.gl.saveLayout())}
function addPanel(){const cfg={type:'component',componentType:'dynamic',title:'동적 패널 '+state.seq++,componentState:{created:Date.now()}}; try{state.gl.addComponent(cfg.componentType,cfg.componentState,cfg.title)}catch{state.gl.rootItem?.addChild(cfg)} log('동적 패널 추가','success');}
function addStack(){const stack={type:'stack',content:[{type:'component',componentType:'dynamic',title:'새 탭 A'},{type:'component',componentType:'chart',title:'새 탭 B'}]}; const target=state.gl.rootItem?.contentItems?.[0]; try{target?.addChild(stack)}catch(e){addPanel()} log('탭 묶음 추가','success');}
function save(){localStorage.setItem('golden-layout-feature-lab',JSON.stringify(resolvedConfig()));log('브라우저에 레이아웃 저장','success');toast('레이아웃 저장 완료');}
function restore(){const s=localStorage.getItem('golden-layout-feature-lab');if(!s)return toast('저장된 레이아웃이 없습니다');try{create(JSON.parse(s));toast('저장 레이아웃 복원 완료')}catch(e){toast('복원 실패: '+e.message)}}
function openJson(){ $('jsonText').value=JSON.stringify(resolvedConfig(),null,2); $('jsonDialog').showModal();}
function applyJson(){try{create(JSON.parse($('jsonText').value));$('jsonDialog').close();toast('JSON 레이아웃 적용 완료')}catch(e){toast('JSON 오류: '+e.message)}}
function popout(){const item=state.focused||state.gl.rootItem?.getAllContentItems?.().find(x=>x.isComponent); if(!item)return toast('팝아웃할 패널이 없습니다'); try{item.popout?.();log('선택 패널 팝아웃 요청','success')}catch(e){toast('팝아웃 실패 또는 차단됨')}}

$('applyPreset').onclick=()=>create(structuredClone(presets[$('preset').value])); $('addPanel').onclick=addPanel; $('addStack').onclick=addStack; $('save').onclick=save; $('restore').onclick=restore; $('json').onclick=openJson; $('applyJson').onclick=applyJson; $('closeJson').onclick=()=>$('jsonDialog').close(); $('copyJson').onclick=async()=>{await navigator.clipboard.writeText($('jsonText').value);toast('JSON 복사 완료')};
$('downloadJson').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('jsonText').value],{type:'application/json'}));a.download='golden-layout-config.json';a.click();URL.revokeObjectURL(a.href)};
$('popout').onclick=popout; $('closeFocused').onclick=()=>{if(!state.focused)return toast('먼저 패널을 선택하세요');try{state.focused.close?.();state.focused=null;$('focusName').textContent='없음'}catch(e){toast('닫을 수 없습니다')}};
$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('light',state.theme==='light');themeLink.href=state.theme==='dark'?'https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/themes/goldenlayout-dark-theme.css':'https://cdn.jsdelivr.net/npm/golden-layout@2.6.0/dist/css/themes/goldenlayout-light-theme.css';toast(state.theme==='dark'?'다크 테마':'라이트 테마')};
window.addEventListener('resize',fit); new ResizeObserver(fit).observe(container); window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();restore()}if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();addPanel()}});
setInterval(()=>$('clock').textContent=new Date().toLocaleString('ko-KR'),1000);

try{create(structuredClone(presets.ide))}catch(e){container.innerHTML=`<div class="empty"><div><h2>Golden Layout 로드 실패</h2><p>${e.message}</p><p>인터넷 연결 및 CDN 접근 여부를 확인하세요.</p></div></div>`;console.error(e)}
</script>
</body>
</html>
