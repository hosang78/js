<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdff5"/>
      <stop offset="1" stop-color="#e8f4fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb8"/>
      <stop offset="1" stop-color="#1c5c8c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="330" fill="url(#sky)"/>
  <rect x="0" y="330" width="800" height="270" fill="url(#sea)"/>

  <circle cx="680" cy="90" r="46" fill="#fff2b8"/>

  <g opacity="0.9">
    <ellipse cx="120" cy="150" rx="70" ry="18" fill="#ffffff"/>
    <ellipse cx="260" cy="110" rx="50" ry="14" fill="#ffffff"/>
    <ellipse cx="500" cy="160" rx="60" ry="16" fill="#ffffff"/>
  </g>

  <g>
    <polygon points="90,330 710,330 640,400 160,400" fill="#8a5a34"/>
    <rect x="160" y="400" width="480" height="14" fill="#6e4527"/>
  </g>

  <g>
    <rect x="200" y="345" width="46" height="34" fill="#d98a3d" stroke="#8a5a24" stroke-width="3"/>
    <rect x="256" y="345" width="46" height="34" fill="#d98a3d" stroke="#8a5a24" stroke-width="3"/>
    <rect x="228" y="311" width="46" height="34" fill="#e0995a" stroke="#8a5a24" stroke-width="3"/>
  </g>

  <g>
    <rect x="470" y="350" width="52" height="38" fill="#d98a3d" stroke="#8a5a24" stroke-width="3"/>
    <rect x="530" y="350" width="52" height="38" fill="#d98a3d" stroke="#8a5a24" stroke-width="3"/>
  </g>

  <g transform="translate(340,470)">
    <ellipse rx="70" ry="34" fill="#3f7fae"/>
    <polygon points="65,0 110,0 65,-28" fill="#3f7fae"/>
    <rect x="-90" y="-6" width="180" height="12" fill="#2c5f85"/>
  </g>

  <g transform="translate(150,470) scale(1.1)">
    <ellipse rx="34" ry="16" fill="#4f8fbf"/>
    <polygon points="-34,0 -50,-14 -50,14" fill="#4f8fbf"/>
    <circle cx="16" cy="-3" r="2.4" fill="#0b0b0b"/>
  </g>
  <g transform="translate(560,510) scale(0.9) rotate(8)">
    <ellipse rx="34" ry="16" fill="#5aa0cf"/>
    <polygon points="-34,0 -50,-14 -50,14" fill="#5aa0cf"/>
    <circle cx="16" cy="-3" r="2.4" fill="#0b0b0b"/>
  </g>
  <g transform="translate(430,540) scale(0.8) rotate(-6)">
    <ellipse rx="34" ry="16" fill="#3f7fae"/>
    <polygon points="-34,0 -50,-14 -50,14" fill="#3f7fae"/>
    <circle cx="16" cy="-3" r="2.4" fill="#0b0b0b"/>
  </g>

  <text x="400" y="590" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffffaa">가상의 위판장 일러스트 (실제 사진 아님)</text>
</svg>
