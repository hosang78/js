<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphology 종합 기능 실험실</title>
<style>
:root{
  --bg:#08111f;--panel:#101d2f;--panel2:#15243a;--line:#263a55;--text:#edf4ff;--muted:#94a7c2;
  --accent:#54d2c5;--accent2:#7d8cff;--warn:#ffbf69;--danger:#ff6b7c;--ok:#61d095;
  --shadow:0 18px 42px rgba(0,0,0,.28);--radius:16px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;background:linear-gradient(180deg,#0c1728,#091321);border-right:1px solid var(--line);overflow:auto}
.brand{padding:4px 8px 22px}.brand .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800}.brand h1{font-size:22px;margin:8px 0 6px}.brand p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover{background:#13243a;color:var(--text)}.nav button.active{background:linear-gradient(90deg,rgba(84,210,197,.18),rgba(125,140,255,.12));color:var(--text);box-shadow:inset 3px 0 var(--accent)}
.nav .num{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#1a2b44;font-size:11px;font-weight:800;color:var(--accent)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 22px;background:rgba(8,17,31,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.title-group h2{margin:0;font-size:18px}.title-group p{margin:4px 0 0;font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#15243a;color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:12px;font-weight:700}.btn:hover{transform:translateY(-1px);border-color:#3d587a}.btn.primary{background:linear-gradient(135deg,var(--accent),#3fb4cf);color:#062129;border:0}.btn.accent{background:linear-gradient(135deg,var(--accent2),#6574ee);border:0}.btn.danger{color:#ffdbe0;border-color:#6b3542}.btn.small{padding:7px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.content{padding:20px}.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:16px;margin-bottom:16px}.card{background:linear-gradient(180deg,rgba(21,36,58,.96),rgba(13,27,45,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.graph-card{overflow:hidden;min-height:560px;display:flex;flex-direction:column}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.card-head h3{margin:0;font-size:14px}.card-head .hint{font-size:11px;color:var(--muted)}
#graphSvg{width:100%;height:500px;display:block;background:radial-gradient(circle at 50% 45%,#132a43 0,#0b1728 58%,#08121e 100%);touch-action:none}.graph-footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;background:#13243a;border:1px solid #2b4260;border-radius:999px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.inspector{display:flex;flex-direction:column;min-height:560px}.inspector-body{padding:14px;overflow:auto;max-height:535px}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px;background:#0e1a2c;border:1px solid var(--line);border-radius:12px}.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat .v{font-size:20px;font-weight:800;margin-top:5px}.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12px;margin-top:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
.section{display:none}.section.active{display:block}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.section-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:16px}.panel h3{font-size:14px;margin:0 0 6px}.panel p.desc{font-size:11px;line-height:1.6;color:var(--muted);margin:0 0 14px}.controls{display:flex;gap:8px;flex-wrap:wrap}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;background:#0b1728;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:150px;resize:vertical;font-family:"Cascadia Code",Consolas,monospace;font-size:11px;line-height:1.5}
.result{margin-top:12px;background:#091422;border:1px solid #203550;border-radius:11px;padding:11px;min-height:72px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:"Cascadia Code",Consolas,monospace;font-size:11px;line-height:1.55;color:#c9d8ed}.result.ok{border-color:#285c4c}.result.err{border-color:#6f3340;color:#ffd2d8}
.table-wrap{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:10px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:8px 9px;border-bottom:1px solid #1f334d;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#13243a;color:#a8bdd9}tr:hover td{background:#122138}
.code{background:#07111d;border:1px solid #1e314a;border-radius:10px;padding:12px;white-space:pre;overflow:auto;color:#b9cbe3;font-family:"Cascadia Code",Consolas,monospace;font-size:10px;line-height:1.55}.subtle{color:var(--muted);font-size:11px}.separator{height:1px;background:var(--line);margin:14px 0}.chip-row{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;border-radius:999px;background:#172a43;border:1px solid #2b4668;font-size:10px;color:#c4d4ea}.chip.on{background:rgba(84,210,197,.15);border-color:#337c75;color:#a8fff4}
.event-list{height:330px;overflow:auto;background:#08131f;border:1px solid var(--line);border-radius:10px;padding:9px}.event{padding:8px 9px;border-bottom:1px solid #182a41;font-family:Consolas,monospace;font-size:10px}.event .time{color:#68819f}.event .type{color:var(--accent);font-weight:800}.event .payload{color:#b6c8df;word-break:break-all}
.toast{position:fixed;right:22px;bottom:22px;z-index:50;background:#10243a;border:1px solid #34516f;color:white;border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);transform:translateY(25px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}.toast.error{border-color:#8a3c4a}
svg .edge{stroke:#58708f;stroke-opacity:.72;transition:.15s}.edge.highlight{stroke:var(--warn);stroke-opacity:1}.node circle{stroke:#07111d;stroke-width:3;cursor:pointer;transition:.15s}.node:hover circle{stroke:var(--accent);stroke-width:5}.node.selected circle{stroke:#fff;stroke-width:5}.node.highlight circle{stroke:var(--warn);stroke-width:6}.node text{font-size:12px;fill:#eff7ff;font-weight:700;paint-order:stroke;stroke:#08111f;stroke-width:3px;stroke-linejoin:round;pointer-events:none}.edge-label{font-size:9px;fill:#9fb4cf;paint-order:stroke;stroke:#07111d;stroke-width:3px}
.mobile-nav{display:none}.warning{padding:10px 12px;border-radius:10px;background:rgba(255,191,105,.1);border:1px solid rgba(255,191,105,.32);color:#ffdaaa;font-size:11px;line-height:1.5}
@media(max-width:1050px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:block;max-width:170px}.workspace{grid-template-columns:1fr}.inspector{min-height:auto}.section-grid,.section-grid.three{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}.content{padding:12px}}
@media(max-width:620px){.topbar{flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.field-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}#graphSvg{height:420px}.graph-card{min-height:490px}.content{padding:8px}.card{border-radius:12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="eyebrow">GRAPH DATA LAB</div><h1>Graphology</h1><p>그래프 자료구조·알고리즘·레이아웃·직렬화를 한 파일에서 실습하는 종합 샘플</p></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="title-group"><h2 id="pageTitle">대시보드</h2><p id="pageDesc">현재 그래프의 구조와 선택 항목을 확인합니다.</p></div>
      <select class="mobile-nav" id="mobileNav"></select>
      <div class="top-actions">
        <button class="btn" id="sampleBtn">기본 그래프</button>
        <button class="btn" id="weightsBtn">가중치 재생성</button>
        <button class="btn primary" id="downloadJsonTop">JSON 저장</button>
      </div>
    </header>
    <div class="content">
      <div class="workspace">
        <section class="card graph-card">
          <div class="card-head"><div><h3>그래프 뷰</h3><div class="hint">노드 클릭 선택 · 노드 드래그 이동 · 휠 확대/축소</div></div><div class="controls"><button class="btn small" id="fitBtn">화면 맞춤</button><button class="btn small" id="labelsBtn">레이블</button></div></div>
          <svg id="graphSvg" viewBox="0 0 1000 650" aria-label="Graphology graph visualization">
            <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="17" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#6f88a8"></path></marker></defs>
            <g id="viewport"><g id="edgesLayer"></g><g id="edgeLabelsLayer"></g><g id="nodesLayer"></g></g>
          </svg>
          <div class="graph-footer"><span class="badge"><span class="dot"></span><span id="engineStatus">Graphology 준비</span></span><span id="graphSummary"></span></div>
        </section>
        <aside class="card inspector"><div class="card-head"><h3>실시간 인스펙터</h3><span class="hint" id="selectedHint">그래프 전체</span></div><div class="inspector-body" id="inspectorBody"></div></aside>
      </div>

      <section id="sec-overview" class="section active"></section>
      <section id="sec-constructors" class="section"></section>
      <section id="sec-mutation" class="section"></section>
      <section id="sec-read" class="section"></section>
      <section id="sec-generators" class="section"></section>
      <section id="sec-traversal" class="section"></section>
      <section id="sec-components" class="section"></section>
      <section id="sec-metrics" class="section"></section>
      <section id="sec-community" class="section"></section>
      <section id="sec-layout" class="section"></section>
      <section id="sec-operators" class="section"></section>
      <section id="sec-serialization" class="section"></section>
      <section id="sec-events" class="section"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<script>

function generatorGraph(type,n,p,c){let g;switch(type){case'complete':g=L.generators.classic.complete(UndirectedGraph,n);break;case'empty':g=L.generators.classic.empty(Graph,n);break;case'path':g=L.generators.classic.path(UndirectedGraph,n);break;case'ladder':g=L.generators.classic.ladder(UndirectedGraph,Math.max(2,Math.floor(n/2)));break;case'caveman':g=L.generators.community.caveman(UndirectedGraph,c,Math.max(2,Math.floor(n/c)));break;case'connectedCaveman':g=L.generators.community.connectedCaveman(UndirectedGraph,c,Math.max(2,Math.floor(n/c)));break;case'erdosRenyi':g=L.generators.random.erdosRenyi(UndirectedGraph,{order:n,probability:p});break;case'clusters':g=L.generators.random.clusters(UndirectedGraph,{order:n,size:Math.max(n*2,Math.round(n*n*p)),clusters:c,clusterDensity:.7});break;case'girvanNewman':g=L.generators.random.girvanNewman(UndirectedGraph,{zOut:Math.max(1,Math.round(p*10))});break;case'kite':g=L.generators.small.krackhardtKite(UndirectedGraph);break;case'karate':g=L.generators.social.karateClub(UndirectedGraph);break;case'florentine':g=L.generators.social.florentineFamilies(UndirectedGraph);break;}
 g.updateEachNodeAttributes((node,a)=>({...a,label:a.label||String(node),size:10+(g.degree(node)||0)*.7,color:palette[(Number(a.cluster)||0)%palette.length]}));g.updateEachEdgeAttributes((e,a)=>({...a,weight:Number(a.weight)||1,label:a.label||''}));L.layout.circular.assign(g,{scale:100});return g;}
function centrality(type){const g=state.graph;switch(type){case'degree':return L.metrics.centrality.degree(g,{normalized:true});case'closeness':return L.metrics.centrality.closeness(g);case'betweenness':return L.metrics.centrality.betweenness(g,{getEdgeWeight:'weight',normalized:true});case'eigenvector':return L.metrics.centrality.eigenvector(g,{getEdgeWeight:'weight'});case'pagerank':return L.metrics.centrality.pagerank(g,{getEdgeWeight:'weight'});case'hits':return L.metrics.centrality.hits(g,{getEdgeWeight:'weight'});}}
function normalizeCentralityOutput(v,type){if(type==='hits')return v.authorities||v.hubs||{};return v;}
