<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Drawflow 종합 기능 샘플</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f7fb;color:#172033}button,select,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:10px;align-items:center;padding:12px;background:white;border-bottom:1px solid #dbe3ef;flex-wrap:wrap}.brand{font-weight:800;font-size:18px;margin-right:auto}.btn{border:1px solid #cfd8e6;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.main{display:grid;grid-template-columns:240px 1fr 280px;min-height:0}.side,.inspector{background:#fff;padding:12px;overflow:auto}.side{border-right:1px solid #dbe3ef}.inspector{border-left:1px solid #dbe3ef}.palette{display:grid;gap:8px}.item{border:1px solid #dbe3ef;border-radius:12px;padding:10px;background:#fff;cursor:grab}.item b{display:block}.item small{color:#687386}.canvas-wrap{position:relative;overflow:hidden;background-color:#f7f9fc;background-image:linear-gradient(#dfe7f1 1px,transparent 1px),linear-gradient(90deg,#dfe7f1 1px,transparent 1px);background-size:32px 32px}.canvas{position:absolute;inset:0;overflow:hidden;touch-action:none}.node{position:absolute;width:190px;background:#fff;border:1px solid #bac7d8;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.12);user-select:none}.node.selected{outline:3px solid #60a5fa}.node-head{padding:10px 12px;border-radius:14px 14px 0 0;color:#fff;font-weight:800;cursor:move}.node-body{padding:10px;font-size:13px}.node-body input,.node-body textarea,.node-body select{width:100%;border:1px solid #d6deea;border-radius:8px;padding:7px}.port{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #334155;top:50%;transform:translateY(-50%);z-index:3}.port.in{left:-9px}.port.out{right:-9px}.port[data-index="2"]{top:72%}.port[data-index="3"]{top:88%}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wire{fill:none;stroke:#64748b;stroke-width:3;pointer-events:stroke}.wire.selected{stroke:#ef4444;stroke-width:5}.status{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid #dbe3ef;border-radius:10px;padding:7px 10px;font-size:12px}.section{margin-bottom:16px}.section h3{font-size:14px;margin:0 0 8px}.log{font:12px/1.5 monospace;white-space:pre-wrap;background:#0f172a;color:#dbeafe;border-radius:10px;padding:10px;min-height:160px}.json{width:100%;height:220px;font:11px/1.45 monospace}.hint{font-size:12px;color:#64748b;line-height:1.55}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eef8;font-size:11px}.error{margin:18px;padding:16px;border:1px solid #ef4444;background:#fff1f2;color:#991b1b;border-radius:12px}.dark{filter:invert(.92) hue-rotate(180deg)}
@media(max-width:900px){.main{grid-template-columns:1fr}.side,.inspector{position:fixed;top:68px;bottom:0;width:280px;z-index:20;transition:.2s}.side{left:-290px}.side.open{left:0}.inspector{right:-290px}.inspector.open{right:0}.canvas-wrap{min-height:calc(100vh - 68px)}.top{gap:6px}.btn{padding:8px 10px}.brand{font-size:16px;width:100%;margin:0}.top .spacer{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">Drawflow 기능 실험실</div><button class="btn" id="togglePalette">☰ 노드</button><button class="btn" id="sampleBtn">샘플 다시 만들기</button><button class="btn" id="undoBtn">실행취소</button><button class="btn" id="redoBtn">다시실행</button><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomReset">100%</button><button class="btn" id="zoomIn">＋</button><button class="btn" id="themeBtn">테마</button><button class="btn" id="importBtn">가져오기</button><button class="btn" id="exportBtn">내보내기</button><button class="btn primary" id="saveBtn">저장</button><button class="btn" id="toggleInspector">속성</button><input type="file" id="fileInput" accept="application/json" hidden></header>
<div class="main"><aside class="side" id="sidebar"><div class="section"><h3>노드 추가</h3><div class="palette" id="palette"></div></div><div class="hint">노드를 탭하면 추가됩니다. 출력 포트를 누른 뒤 입력 포트를 누르면 연결됩니다. 노드는 제목 부분을 드래그해 이동합니다.</div></aside>
<main class="canvas-wrap"><svg class="wires" id="wires"></svg><div class="canvas" id="canvas"></div><div class="status" id="status">준비</div></main>
<aside class="inspector" id="inspector"><div class="section"><h3>선택 항목</h3><div id="props" class="hint">노드 또는 연결선을 선택하세요.</div></div><div class="section"><h3>워크플로 JSON</h3><textarea class="json" id="json"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="applyJson">적용</button><button class="btn" id="copyJson">복사</button></div></div><div class="section"><h3>이벤트 로그</h3><div class="log" id="log"></div></div></aside></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s); const canvas=$('#canvas'), wires=$('#wires');
const defs=[
 {type:'source',name:'입력 데이터',desc:'폼·API·파일 입력',color:'#0ea5e9',ins:0,outs:1},
 {type:'transform',name:'데이터 변환',desc:'정제·매핑·계산',color:'#8b5cf6',ins:1,outs:1},
 {type:'condition',name:'조건 분기',desc:'참·거짓 분기',color:'#f59e0b',ins:1,outs:2},
 {type:'action',name:'업무 처리',desc:'알림·승인·저장',color:'#10b981',ins:1,outs:1},
 {type:'ai',name:'AI 분석',desc:'요약·분류·추출',color:'#ec4899',ins:1,outs:1},
 {type:'database',name:'데이터베이스',desc:'조회·저장',color:'#475569',ins:1,outs:1},
 {type:'note',name:'메모',desc:'연결 없는 설명',color:'#eab308',ins:0,outs:0},
 {type:'multi',name:'다중 포트',desc:'복수 입출력',color:'#334155',ins:2,outs:3}
];
let state={nodes:[],connections:[],zoom:1,pan:{x:0,y:0}}, selected=null, pending=null, hist=[], future=[];
const log=(m)=>{$('#log').textContent=`${new Date().toLocaleTimeString()}  ${m}\n`+$('#log').textContent};
const snap=()=>JSON.stringify(state); function commit(){hist.push(snap());if(hist.length>50)hist.shift();future=[];refreshJson()}
function restore(s){state=JSON.parse(s);selected=null;pending=null;render()}
function nodeBy(id){return state.nodes.find(n=>n.id===id)}
function addNode(type,x=80+Math.random()*220,y=80+Math.random()*260,save=true){const d=defs.find(v=>v.type===type);const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);state.nodes.push({id,type,x,y,label:d.name,description:d.desc,data:{value:''}});if(save)commit();render();log(`노드 추가: ${d.name}`);return id}
function removeNode(id){state.nodes=state.nodes.filter(n=>n.id!==id);state.connections=state.connections.filter(c=>c.from!==id&&c.to!==id);selected=null;commit();render();log('노드 삭제')}
function addConnection(from,out,to,input){if(from===to)return;if(state.connections.some(c=>c.from===from&&c.out===out&&c.to===to&&c.input===input))return;state.connections.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),from,out,to,input});pending=null;commit();render();log('연결 생성')}
function removeConnection(id){state.connections=state.connections.filter(c=>c.id!==id);selected=null;commit();render();log('연결 삭제')}
function portPos(node,kind,index){const wrap=canvas.getBoundingClientRect();const el=document.querySelector(`[data-node="${node.id}"][data-kind="${kind}"][data-index="${index}"]`);if(!el)return{x:0,y:0};const r=el.getBoundingClientRect();return{x:(r.left+r.width/2-wrap.left)/state.zoom,y:(r.top+r.height/2-wrap.top)/state.zoom}}
function renderWires(){wires.innerHTML='';const rect=canvas.getBoundingClientRect();wires.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);state.connections.forEach(c=>{const a=nodeBy(c.from),b=nodeBy(c.to);if(!a||!b)return;const p1=portPos(a,'out',c.out),p2=portPos(b,'in',c.input);const x1=p1.x*state.zoom+state.pan.x,y1=p1.y*state.zoom+state.pan.y,x2=p2.x*state.zoom+state.pan.x,y2=p2.y*state.zoom+state.pan.y;const dx=Math.max(60,Math.abs(x2-x1)*.45);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);path.setAttribute('class','wire'+(selected?.kind==='conn'&&selected.id===c.id?' selected':''));path.style.pointerEvents='stroke';path.addEventListener('click',e=>{e.stopPropagation();selected={kind:'conn',id:c.id};render();});wires.appendChild(path)})}
function render(){canvas.innerHTML='';canvas.style.transformOrigin='0 0';canvas.style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;
 state.nodes.forEach(n=>{const d=defs.find(v=>v.type===n.type),el=document.createElement('div');el.className='node'+(selected?.kind==='node'&&selected.id===n.id?' selected':'');el.style.left=n.x+'px';el.style.top=n.y+'px';el.dataset.id=n.id;let ports='';for(let i=1;i<=d.ins;i++)ports+=`<span class="port in" data-node="${n.id}" data-kind="in" data-index="${i}"></span>`;for(let i=1;i<=d.outs;i++)ports+=`<span class="port out" data-node="${n.id}" data-kind="out" data-index="${i}"></span>`;
 el.innerHTML=`${ports}<div class="node-head" style="background:${d.color}">${n.label}</div><div class="node-body"><div>${n.description}</div>${n.type==='note'?`<textarea data-field="value" placeholder="메모">${n.data.value||''}</textarea>`:`<input data-field="value" value="${String(n.data.value||'').replace(/"/g,'&quot;')}" placeholder="값 입력">`}</div>`;
 el.addEventListener('click',e=>{e.stopPropagation();selected={kind:'node',id:n.id};render();});
 el.querySelectorAll('.port').forEach(p=>p.addEventListener('click',e=>{e.stopPropagation();const kind=p.dataset.kind,idx=+p.dataset.index;if(kind==='out'){pending={node:n.id,out:idx};$('#status').textContent='연결할 입력 포트를 선택하세요';}else if(pending){addConnection(pending.node,pending.out,n.id,idx)}render();}));
 el.querySelector('[data-field]').addEventListener('input',e=>{n.data.value=e.target.value;refreshJson()});
 const head=el.querySelector('.node-head');head.addEventListener('pointerdown',e=>{e.stopPropagation();head.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y;const move=ev=>{n.x=ox+(ev.clientX-sx)/state.zoom;n.y=oy+(ev.clientY-sy)/state.zoom;el.style.left=n.x+'px';el.style.top=n.y+'px';renderWires()};const up=()=>{head.removeEventListener('pointermove',move);head.removeEventListener('pointerup',up);commit();log('노드 이동')};head.addEventListener('pointermove',move);head.addEventListener('pointerup',up)});
 canvas.appendChild(el)});requestAnimationFrame(renderWires);renderProps();refreshJson();$('#status').textContent=`노드 ${state.nodes.length} · 연결 ${state.connections.length} · ${Math.round(state.zoom*100)}%`}
function renderProps(){const p=$('#props');if(!selected){p.innerHTML='노드 또는 연결선을 선택하세요.';return}if(selected.kind==='conn'){p.innerHTML=`<div class="badge">연결선</div><p>선택된 연결을 삭제할 수 있습니다.</p><button class="btn" id="deleteSelected">연결 삭제</button>`;$('#deleteSelected').onclick=()=>removeConnection(selected.id);return}const n=nodeBy(selected.id);if(!n)return;p.innerHTML=`<label>이름<input id="propLabel" value="${n.label.replace(/"/g,'&quot;')}" style="width:100%;margin:6px 0 10px;padding:8px"></label><label>설명<textarea id="propDesc" style="width:100%;height:70px;margin:6px 0 10px;padding:8px">${n.description}</textarea></label><button class="btn" id="deleteSelected">노드 삭제</button>`;$('#propLabel').oninput=e=>{n.label=e.target.value;render()};$('#propDesc').oninput=e=>{n.description=e.target.value;render()};$('#deleteSelected').onclick=()=>removeNode(n.id)}
function refreshJson(){$('#json').value=JSON.stringify(state,null,2)}
function sample(){state={nodes:[],connections:[],zoom:1,pan:{x:0,y:0}};const a=addNode('source',50,80,false),b=addNode('transform',300,80,false),c=addNode('condition',550,80,false),d=addNode('action',790,20,false),e=addNode('database',790,190,false);state.connections=[{id:'c1',from:a,out:1,to:b,input:1},{id:'c2',from:b,out:1,to:c,input:1},{id:'c3',from:c,out:1,to:d,input:1},{id:'c4',from:c,out:2,to:e,input:1}];hist=[];commit();render();log('샘플 워크플로 생성')}
defs.forEach(d=>{const x=document.createElement('div');x.className='item';x.innerHTML=`<b>${d.name}</b><small>${d.desc}</small>`;x.onclick=()=>addNode(d.type);$('#palette').appendChild(x)});
canvas.addEventListener('click',()=>{selected=null;pending=null;render()});
$('#sampleBtn').onclick=sample;$('#undoBtn').onclick=()=>{if(hist.length<2)return;future.push(hist.pop());restore(hist[hist.length-1]);log('실행취소')};$('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();hist.push(s);restore(s);log('다시실행')};
$('#zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);render()};$('#zoomOut').onclick=()=>{state.zoom=Math.max(.4,state.zoom-.1);render()};$('#zoomReset').onclick=()=>{state.zoom=1;state.pan={x:0,y:0};render()};
$('#themeBtn').onclick=()=>document.body.classList.toggle('dark');$('#togglePalette').onclick=()=>$('#sidebar').classList.toggle('open');$('#toggleInspector').onclick=()=>$('#inspector').classList.toggle('open');
$('#saveBtn').onclick=()=>{localStorage.setItem('drawflow-fixed-sample',snap());log('로컬 저장 완료')};
$('#applyJson').onclick=()=>{try{const v=JSON.parse($('#json').value);if(!Array.isArray(v.nodes)||!Array.isArray(v.connections))throw Error('형식 오류');state=v;commit();render();log('JSON 적용')}catch(e){alert('JSON 형식이 올바르지 않습니다.')}};
$('#copyJson').onclick=async()=>{try{await navigator.clipboard.writeText($('#json').value);log('JSON 복사')}catch(e){$('#json').select();document.execCommand('copy')}};
$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snap()],{type:'application/json'}));a.download='drawflow-workflow.json';a.click();URL.revokeObjectURL(a.href)};
$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());commit();render();log('JSON 가져오기')}catch(err){alert('가져오기 실패')}};
window.addEventListener('resize',renderWires);document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&selected){selected.kind==='node'?removeNode(selected.id):removeConnection(selected.id)}});
try{const saved=localStorage.getItem('drawflow-fixed-sample');if(saved){state=JSON.parse(saved);commit();render();log('저장 데이터 복원')}else sample()}catch(e){sample()}
})();
</script></body></html>
